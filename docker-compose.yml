services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots
      - ./config:/app/config
    environment:
      - ENVIRONMENT=production
      - LOG_JSON=true
      - DATABASE_URL=sqlite+aiosqlite:///data/hotels.db
      - SCRAPER_HEADLESS=true
    command: ["scrape", "--region", "Mumbai"]

